name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  build-release:
    name: Build & Upload Windows Release Asset
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Optimized Release Binary
        run: cargo build --release

      - name: Prepare Single Versioned Binary
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v0.1.0" }
          Copy-Item target/release/winmedic.exe "target/release/winmedic-${tag}.exe"

      - name: Upload Binary to Release Assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ !startsWith(github.ref_name, 'v1.') }}
          files: target/release/winmedic-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
