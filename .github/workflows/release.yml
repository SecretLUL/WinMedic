name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.0). Leave empty to use version from Cargo.toml'
        required: false
        type: string
        default: ''

jobs:
  build-release:
    name: Build & Upload Windows Release Asset
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Resolve Release Tag
        id: resolve-tag
        shell: pwsh
        run: |
          $inputTag = "${{ inputs.tag }}".Trim()
          if ($inputTag) {
            $tag = if ($inputTag.StartsWith("v")) { $inputTag } else { "v$inputTag" }
          } elseif ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME -match '^v\d') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $match = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"'
            $ver = if ($match) { $match.Matches[0].Groups[1].Value } else { "0.3.0" }
            $tag = "v$ver"
          }
          Write-Host "Resolved release tag: $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # --locked forbids Cargo from silently resolving different dependency
      # versions than the ones committed in Cargo.lock, so the published binary
      # is reproducible from the tagged tree.
      - name: Build Optimized Release Binary
        run: cargo build --locked --release

      - name: Prepare Single Versioned Binary
        shell: pwsh
        run: |
          $tag = "${{ steps.resolve-tag.outputs.tag }}"
          Copy-Item target/release/winmedic.exe "target/release/winmedic-${tag}.exe"

      # WinMedic ships unsigned, so SmartScreen cannot vouch for the download.
      # A published checksum at least lets users verify that the .exe they got
      # is byte-for-byte the one this workflow produced.
      - name: Generate SHA256 Checksum
        shell: pwsh
        run: |
          $tag = "${{ steps.resolve-tag.outputs.tag }}"
          $name = "winmedic-${tag}.exe"
          $hash = (Get-FileHash -Path "target/release/$name" -Algorithm SHA256).Hash.ToLower()
          # sha256sum-compatible layout: "<hash>  <filename>"
          "$hash  $name" | Out-File -FilePath "target/release/$name.sha256" -Encoding ascii
          Write-Host "$name -> $hash"

      # Hand-written notes live at docs/release-notes/<tag>.md. When a tag ships
      # without one, fall back to GitHub's generated commit list rather than
      # publishing a release with an empty body.
      - name: Resolve Release Notes
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ steps.resolve-tag.outputs.tag }}"
          $path = "docs/release-notes/${tag}.md"
          if (Test-Path $path) {
            Write-Host "Using release notes from $path"
            "body_path=$path"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "generate=false"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "No manual release notes found at $path, generating from commits"
            "body_path="       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "generate=true"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Upload Binary to Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.resolve-tag.outputs.tag }}
          name: ${{ steps.resolve-tag.outputs.tag }}
          prerelease: ${{ contains(steps.resolve-tag.outputs.tag, '-') }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          files: |
            target/release/winmedic-*.exe
            target/release/winmedic-*.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
