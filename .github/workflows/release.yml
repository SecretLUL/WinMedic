name: Release

# The version a release ships under is decided here and written into the tree
# *before* anything is built, so the tag, the committed Cargo.toml and the
# string the binary prints cannot disagree. They used to: v0.3.1 and v0.3.2 were
# both built from a tree that still said 0.3.0, so the published tool introduced
# itself as 0.3.0 and — since the update check compares that same constant
# against the newest GitHub release — kept offering its own release as an
# available update.
#
# "Run workflow" is the supported way to release. The tag triggers are kept for
# releases cut by hand, but a tag is immutable, so on that path the tree can
# only be checked, not corrected.
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.3.3 (a leading "v" is fine)'
        required: true
        type: string
      dry_run:
        description: 'Rehearsal: build and verify everything, but push no tag and publish no release'
        required: false
        type: boolean
        default: false

# Two releases in flight at once would race for the tag and the branch.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The bump commit has to sit on top of real history, and a shallow
          # clone cannot push a branch update.
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # User-supplied text reaches the shell through the environment rather than
      # through ${{ }} interpolation, which would splice it into the script body.
      - name: Resolve version
        id: v
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:INPUT_VERSION
          } else {
            $version = if ($env:EVENT_TAG) { $env:EVENT_TAG } else { $env:GITHUB_REF_NAME }
          }

          $version = $version.Trim().TrimStart('v', 'V')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Not a SemVer version: '$version' (expected something like 0.3.3 or 1.0.0-rc1)"
          }
          $tag = "v$version"

          # Cheapest failure available: a tag that already exists means the
          # release is a duplicate, and finding that out after a 10-minute LTO
          # build helps nobody.
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            if (git ls-remote --tags origin "refs/tags/$tag") {
              throw "$tag already exists. Pick a version that has not shipped yet."
            }
          }

          Write-Host "Releasing $tag"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Write the version into the tree
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/set-version.ps1 ${{ steps.v.outputs.version }}

      # Nothing to rewrite on this path — the tag already points at a fixed
      # commit. Refusing to build is the only way left to keep a mislabelled
      # binary off the releases page.
      - name: Verify the tagged tree states the tag's version
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/set-version.ps1 ${{ steps.v.outputs.version }} -Check

      # Committed before the build so that the tag names a real, self-consistent
      # tree: `cargo build --locked` below then proves the lockfile edit was
      # right, because a mismatched Cargo.lock fails the build outright.
      - name: Commit and tag the bump
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # -u stages tracked files only. The Rust cache has already restored
          # target/ by this point, so `git add -A` would be one .gitignore slip
          # away from committing a build directory into the release tag.
          if (git status --porcelain --untracked-files=no) {
            git add --update
            git commit -m "chore(release): $env:TAG"
          } else {
            Write-Host "Every version site already stated $env:TAG; tagging HEAD unchanged."
          }
          git tag -a $env:TAG -m "WinMedic $env:TAG"

      # --locked forbids Cargo from silently resolving different dependency
      # versions than the ones committed in Cargo.lock, so the published binary
      # is reproducible from the tagged tree.
      - name: Build Optimized Release Binary
        run: cargo build --locked --release

      # The check the whole workflow exists for. Everything above manipulates
      # files; this asks the actual artifact what it thinks its version is.
      - name: Verify the binary reports the released version
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $reported = (& ./target/release/winmedic.exe --version | Out-String).Trim()
          Write-Host "winmedic.exe --version -> $reported"
          if ($reported -ne "WinMedic $env:VERSION") {
            throw "The binary calls itself '$reported' but this is release v$env:VERSION. Refusing to publish it."
          }

      - name: Prepare Single Versioned Binary
        shell: pwsh
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: Copy-Item target/release/winmedic.exe "target/release/winmedic-$env:TAG.exe"

      # WinMedic ships unsigned, so SmartScreen cannot vouch for the download.
      # A published checksum at least lets users verify that the .exe they got
      # is byte-for-byte the one this workflow produced.
      - name: Generate SHA256 Checksum
        shell: pwsh
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          $name = "winmedic-$env:TAG.exe"
          $hash = (Get-FileHash -Path "target/release/$name" -Algorithm SHA256).Hash.ToLower()
          # sha256sum-compatible layout: "<hash>  <filename>"
          "$hash  $name" | Out-File -FilePath "target/release/$name.sha256" -Encoding ascii
          Write-Host "$name -> $hash"

      # Pushed only once the binary has been built and vetted, so a failed build
      # does not leave a tag behind that nothing was ever released under.
      #
      # This push authenticates as GITHUB_TOKEN, and tags pushed by GITHUB_TOKEN
      # deliberately do not start another workflow run — which is what stops the
      # `push: tags` trigger above from releasing this same version twice.
      - name: Push the release tag
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        shell: pwsh
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: git push origin "refs/tags/$env:TAG"

      # Hand-written notes live at docs/release-notes/<tag>.md. When a tag ships
      # without one, fall back to GitHub's generated commit list rather than
      # publishing a release with an empty body.
      - name: Resolve Release Notes
        id: notes
        shell: pwsh
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          $path = "docs/release-notes/$env:TAG.md"
          if (Test-Path $path) {
            Write-Host "Using release notes from $path"
            "body_path=$path"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "generate=false"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "No manual release notes found at $path, generating from commits"
            "body_path="       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "generate=true"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Upload Binary to Release Assets
        # A rehearsal is the only reason not to publish; the tag-driven paths
        # have no dry_run input to consult.
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          prerelease: ${{ contains(steps.v.outputs.tag, '-') }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          files: |
            target/release/winmedic-*.exe
            target/release/winmedic-*.exe.sha256
        env:
          # Kept on GITHUB_TOKEN even when RELEASE_TOKEN exists: a release
          # published by a PAT would re-fire the `release: published` trigger
          # above and run this whole workflow a second time.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The tag already carries the bump, so the release is correct whatever
      # happens here. This is only about not leaving the branch claiming a
      # version that shipped two releases ago — and about *noticing* when that
      # is what happened.
      #
      # v0.3.4 is why this step no longer trusts exit codes. The direct push was
      # rejected, the fallback branch was pushed, `gh pr create` failed with
      # "GitHub Actions is not permitted to create or approve pull requests",
      # nothing read its exit code, and the script fell through to `exit 0`. The
      # run was green, no pull request existed, and main went on stating 0.3.2
      # while 0.3.4 was the published release — which also meant the shipped
      # tool offered its own release as an available update.
      #
      # So the question "did the bump land" is now put to the remote rather than
      # inferred from the commands that were supposed to make it land.
      #
      # `main` is protected (one approving review, four strict status checks),
      # and GITHUB_TOKEN is not allowed through branch protection. There are two
      # ways to give this step a path that works, and it fails until one of them
      # exists:
      #
      #   * set a RELEASE_TOKEN secret — a PAT with `contents: write` owned by
      #     an account with admin rights, which "Do not allow bypassing" leaves
      #     unblocked — and the bump lands on the branch directly; or
      #   * turn on Settings → Actions → General → Workflow permissions →
      #     "Allow GitHub Actions to create and approve pull requests", and it
      #     arrives as a pull request for review instead.
      #
      # Only the first of those makes this step green. The branch is the sole
      # measure: an open pull request is a path to the branch being correct, not
      # a substitute for it, and a run that has not updated the branch is red
      # whatever the reason. That is deliberate — v0.3.4 went unnoticed for two
      # releases precisely because a run that left the branch stale was allowed
      # to pass.
      #
      # A red run here does not mean the release is broken. The tag, the build
      # and the published assets are all finished and correct by this point; the
      # step is the last one in the job for that reason. Re-running it will not
      # turn it green either, and is not meant to: "Resolve version" refuses a
      # tag that already exists, so the run stands as the record that the branch
      # needed a human.
      - name: Bring the branch up to the released version
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        shell: pwsh
        env:
          BRANCH: ${{ github.ref_name }}
          TAG: ${{ steps.v.outputs.tag }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # A rejected push is an expected outcome here, not an abort: this
          # step's whole job is to notice it and fall back to a pull request.
          # Every exit code below is therefore read by hand.
          $PSNativeCommandUseErrorActionPreference = $false

          $head    = "release/$env:TAG"
          $commit  = git rev-parse HEAD
          $prUrl   = ''
          $reasons = @()

          $remote = 'origin'
          if ($env:RELEASE_TOKEN) {
            # actions/checkout pins GITHUB_TOKEN to every github.com request via
            # an http.extraheader, which outranks credentials in the URL.
            git config --unset-all 'http.https://github.com/.extraheader'
            $remote = "https://x-access-token:$env:RELEASE_TOKEN@github.com/$env:REPO.git"
          } else {
            $reasons += 'No RELEASE_TOKEN secret is set, so the direct push can only succeed while the branch is unprotected.'
          }

          git push $remote "HEAD:refs/heads/$env:BRANCH"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Branch protection rejected the push to $env:BRANCH. Falling back to a pull request, which will leave this step red until it is merged."
            $reasons += "The direct push to $env:BRANCH was rejected."

            git push --force $remote "HEAD:refs/heads/$head"
            if ($LASTEXITCODE -ne 0) {
              $reasons += "The fallback branch $head could not be pushed either, so the bump exists only inside this run."
            } else {
              $body = "Raises the version to ``$env:TAG`` across Cargo.toml, Cargo.lock, the README and the issue template.`n`nThe release itself already shipped from the tag, which carries this same commit — merging this only stops ``$env:BRANCH`` from claiming an older version."
              $created = gh pr create --base $env:BRANCH --head $head --title "chore(release): $env:TAG" --body $body 2>&1 | Out-String
              $createExit = $LASTEXITCODE
              Write-Host $created.Trim()

              if ($createExit -eq 0) {
                $prUrl = ($created -split "`n" | Where-Object { $_ -match '^\s*https://' } | Select-Object -First 1).Trim()
              } else {
                # A re-run finds its own pull request already open, which is
                # fine. Anything else is the failure that went unnoticed before.
                $prUrl = (gh pr list --head $head --state open --json url --jq '.[0].url' 2>&1 | Out-String).Trim()
                if (-not ($prUrl -match '^https://')) {
                  $prUrl = ''
                  $reasons += "gh pr create failed: $($created.Trim())"
                  if ($created -match 'not permitted to create or approve pull requests') {
                    $reasons += 'Turn on Settings -> Actions -> General -> Workflow permissions -> "Allow GitHub Actions to create and approve pull requests", or set a RELEASE_TOKEN secret.'
                  }
                }
              }
            }
          }

          # The one question that matters, asked of the remote. Reading it back
          # also covers a push that reported success but did not end up where
          # this step believes it did.
          git fetch --no-tags $remote "+refs/heads/$($env:BRANCH):refs/remotes/verify/$($env:BRANCH)"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Could not read $env:BRANCH back from the remote, so whether $env:TAG landed on it is unknown. Check it by hand before the next release."
            exit 1
          }

          git merge-base --is-ancestor $commit "refs/remotes/verify/$($env:BRANCH)"
          $landed = ($LASTEXITCODE -eq 0)

          $summary = @()
          if ($landed) {
            Write-Host "$env:BRANCH now states $env:TAG."
            $summary += "### Branch updated"
            $summary += ""
            $summary += "``$env:BRANCH`` now states ``$env:TAG``."
          } elseif ($prUrl) {
            # A path to the branch, not the branch. Still a failure: the version
            # sites are wrong until someone merges it, and the whole reason this
            # step was rewritten is that "we opened a pull request" was allowed
            # to count as "the branch is up to date".
            Write-Host "::error::$env:BRANCH does not state $env:TAG. A pull request is waiting at $prUrl - merge it."
            $summary += "### Merge required: ``$env:BRANCH`` still states the previous version"
            $summary += ""
            $summary += "The release shipped correctly — ``$env:TAG`` is tagged, built and published, and the tag carries the bump. What is outstanding is only the branch, and a pull request is waiting for it:"
            $summary += ""
            $summary += "**$prUrl**"
            $summary += ""
            $summary += "Until that is merged, a build from ``$env:BRANCH`` reports the previous version through CARGO_PKG_VERSION — the header, ``--version``, the HTML report and the update check all read it, so the tool will offer its own release as an available update."
            $summary += ""
            $summary += "This run stays red once it is merged, as the record that the branch was not updated automatically; re-running it will not help, because ``Resolve version`` refuses a tag that already exists. **To make this step pass by itself in future,** set a ``RELEASE_TOKEN`` secret so the bump lands on the branch directly."
          } else {
            Write-Host "::error::$env:BRANCH was not brought up to $env:TAG and no pull request carries the bump."
            $summary += "### The branch was not brought up to ``$env:TAG``"
            $summary += ""
            $summary += "The release shipped correctly — ``$env:TAG`` is tagged, built and published, and the tag carries the bump. What failed is only the step that brings ``$env:BRANCH`` up to it, and **nothing is carrying that bump right now**:"
            $summary += ""
            foreach ($reason in $reasons) { $summary += "- $reason" }
            $summary += ""
            $summary += "Until this is fixed, a build from ``$env:BRANCH`` reports the previous version through CARGO_PKG_VERSION — the header, ``--version``, the HTML report and the update check all read it, so the tool will offer its own release as an available update."
            $summary += ""
            $summary += "**To recover this release:** open a pull request from ``$head`` (it was pushed and still holds the bump), or run ``./scripts/set-version.ps1 $($env:TAG.TrimStart('v'))`` on a branch and merge that."
            $summary += ""
            $summary += "**To stop it happening again:** set a ``RELEASE_TOKEN`` secret, or turn on Settings -> Actions -> General -> Workflow permissions -> 'Allow GitHub Actions to create and approve pull requests'."
          }

          if ($env:GITHUB_STEP_SUMMARY) {
            ($summary -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          # The branch, and nothing else, decides this.
          if (-not $landed) { exit 1 }
          exit 0
