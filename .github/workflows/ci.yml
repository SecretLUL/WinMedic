name: CI

on:
  push:
    branches: [ "main" ]
  # Deliberately unfiltered: a `branches:` filter here matches the PR's *target*
  # branch, so restricting it to main means pull requests into any other branch
  # (long-lived feature branches, release branches) merge without ever being
  # linted, tested or built.
  #
  # `unlabeled` too: taking `documentation` off a pull request has to run what
  # the label skipped. Adding a label changes nothing here; labels.yml checks it.
  pull_request:
    types: [opened, synchronize, reopened, unlabeled]

# Force-pushing to a branch under review should not leave the superseded run
# burning a Windows runner to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Full debug info makes target/ about a gigabyte of PDBs on Windows, which
  # every run links, restores and saves. File and line numbers are all a
  # failing test's backtrace needs. The test profile inherits this one.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Least privilege by default; the audit job widens this for itself.
permissions:
  contents: read

jobs:
  # A pull request labelled `documentation` builds and tests nothing: the jobs
  # below are skipped, and a skipped job satisfies a required check, the way
  # the release build's push-only condition always has. labels.yml fails that
  # label on a pull request that changes anything but documentation.
  #
  # rustfmt, clippy and the test suite share one runner. They do not share a
  # compile — clippy caches under its own driver — but they do share the
  # checkout, the toolchain install and the cache round trip, which is the
  # fixed cost that made a separate `check` job wasteful. The real scan below
  # is the exception: it waits on Windows, not on the compiler.
  test:
    name: Lints & Test Suite
    runs-on: windows-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'documentation') }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Saved from main only. A pull request restores main's cache, but
      # uploading its own took over two minutes per run, and those
      # gigabyte-sized per-PR entries pushed main's out of the 10 GB quota -
      # after which main itself rebuilt clippy from scratch.
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Cheapest gate first: no build required, so a misformatted PR fails in
      # seconds instead of after a full compile.
      - name: Check Formatting (rustfmt)
        run: cargo fmt -- --check

      - name: Lint (clippy)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --locked --verbose

  # The tests feed the modules captured tool output. This feeds them the
  # runner's own Windows: a real scan, read-only — nothing is repaired — that
  # has to end with every module finished. Mocks answer whatever they are
  # asked; this is what notices when Windows would not have. It is the check
  # that would have caught wevtutil refusing every event log query WinMedic
  # sent, which no unit test could.
  #
  # Its own job, because the scan takes one to two minutes on a runner - an
  # elevated DISM /AnalyzeComponentStore is most of it - and needs only a
  # build of the binary, not the lints or the test suite before it.
  smoke:
    name: Smoke-test a real scan
    runs-on: windows-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'documentation') }}
    # TEMPORARY: four scans on four fresh runners at once, to see whether the
    # stall is gone without re-running the job four times.
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # TEMPORARY, to find out why PowerShell calls in the scan sometimes time
      # out: every 2 s the CPU load, the disk's throughput, latency and queue,
      # the processes with the most CPU and I/O, and how many powershell.exe
      # are running, from before the build to the end. It
      # starts no PowerShell 5.1, WMI or Task Scheduler call itself, so it does
      # not warm up what it is watching.
      - name: Sample the runner (temporary)
        shell: pwsh
        run: |
          "uptime $([math]::Round([Environment]::TickCount64 / 1000)) s, $([Environment]::ProcessorCount) cores"
          $cache = Join-Path $env:LOCALAPPDATA 'Microsoft\Windows\PowerShell\ModuleAnalysisCache'
          if (Test-Path $cache) {
            $item = Get-Item $cache
            "PowerShell 5.1 module analysis cache: $($item.Length) bytes, written $($item.LastWriteTime.ToString('s'))"
          } else { 'PowerShell 5.1 module analysis cache: none' }
          foreach ($dir in "$env:ProgramFiles\WindowsPowerShell\Modules", "$env:SystemRoot\System32\WindowsPowerShell\v1.0\Modules") {
            "$dir : $(@(Get-ChildItem $dir -Directory -ErrorAction SilentlyContinue).Count) modules"
          }
          $sampler = Join-Path $env:RUNNER_TEMP 'sampler.ps1'
          Set-Content -Path $sampler -Value @'
          $log = Join-Path $env:RUNNER_TEMP 'runner-samples.txt'
          Add-Type -Namespace Sampler -Name Io -MemberDefinition '[StructLayout(LayoutKind.Sequential)] public struct Counters { public ulong ReadOps, WriteOps, OtherOps, ReadBytes, WriteBytes, OtherBytes; } [DllImport("kernel32.dll")] public static extern bool GetProcessIoCounters(IntPtr process, out Counters counters);'
          $disk = '\PhysicalDisk(_Total)\Disk Bytes/sec', '\PhysicalDisk(_Total)\Avg. Disk sec/Transfer', '\PhysicalDisk(_Total)\Current Disk Queue Length'
          $cores = [Environment]::ProcessorCount
          $seenCpu = @{}
          $seenIo = @{}
          $last = [DateTime]::UtcNow
          while ($true) {
              # Get-Counter takes its one-second sample, then a second more.
              $values = (Get-Counter -Counter $disk -SampleInterval 1 -MaxSamples 1 -ErrorAction SilentlyContinue).CounterSamples.CookedValue
              Start-Sleep -Seconds 1
              $now = [DateTime]::UtcNow
              $span = ($now - $last).TotalSeconds
              $last = $now
              $cpuByName = @{}
              $ioByName = @{}
              $processes = Get-Process
              foreach ($p in $processes) {
                  $cpu = $p.TotalProcessorTime.TotalSeconds
                  if ($null -ne $cpu) {
                      $before = $seenCpu[$p.Id]
                      $seenCpu[$p.Id] = $cpu
                      if ($null -ne $before) { $cpuByName[$p.ProcessName] = ($cpuByName[$p.ProcessName] ?? 0) + ($cpu - $before) }
                  }
                  $counters = [Sampler.Io+Counters]::new()
                  try { $ok = [Sampler.Io]::GetProcessIoCounters($p.Handle, [ref]$counters) } catch { $ok = $false }
                  if ($ok) {
                      $bytes = $counters.ReadBytes + $counters.WriteBytes
                      $before = $seenIo[$p.Id]
                      $seenIo[$p.Id] = $bytes
                      if ($null -ne $before) { $ioByName[$p.ProcessName] = ($ioByName[$p.ProcessName] ?? 0) + ($bytes - $before) }
                  }
              }
              $busy = [math]::Round(100 * (($cpuByName.Values | Measure-Object -Sum).Sum) / ($span * $cores))
              $topCpu = ($cpuByName.GetEnumerator() | Sort-Object Value -Descending | Select-Object -First 3 |
                  ForEach-Object { '{0} {1:N1}s' -f $_.Key, $_.Value }) -join ', '
              $topIo = ($ioByName.GetEnumerator() | Sort-Object Value -Descending | Select-Object -First 3 |
                  ForEach-Object { '{0} {1:N1}MB' -f $_.Key, ($_.Value / 1MB) }) -join ', '
              $shells = @($processes | Where-Object ProcessName -eq 'powershell').Count
              $diskText = if ($values.Count -eq 3) {
                  '{0,5:N1} MB/s {1,5:N0} ms queue {2,2:N0}' -f ($values[0] / 1MB), ($values[1] * 1000), $values[2]
              } else { 'no disk counters' }
              '{0:HH:mm:ss.fff} cpu {1,3}% | disk {2} | powershell.exe {3} | cpu: {4} | io: {5}' -f $now, $busy, $diskText, $shells, $topCpu, $topIo | Add-Content $log
          }
          '@
          Start-Process pwsh -ArgumentList '-NoProfile', '-File', $sampler -WindowStyle Hidden

      - name: Build
        run: cargo build --locked

      # Verbose logging stamps when each module starts and finishes. The
      # runner's settings are thrown away with it.
      - name: Turn on verbose logging
        shell: pwsh
        run: |
          $dir = Join-Path $env:APPDATA 'WinMedic'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Content -Path (Join-Path $dir 'config.json') -Value '{ "verbose_logging": true }'

      # Each line is printed as it comes, so the log's timestamps say when:
      # collected and printed at the end, every line had the same one, and a
      # module that timed out could not be told from one that started late.
      - name: Scan
        shell: pwsh
        run: |
          $lines = [System.Collections.Generic.List[string]]::new()
          cargo run --locked --quiet -- --scan 2>&1 | ForEach-Object {
            $line = "$_"
            Write-Host $line
            $lines.Add($line)
          }
          $code = $LASTEXITCODE
          $out = $lines -join "`n"
          if ($code -gt 2) { throw "winmedic --scan exited with $code" }
          $failed = [regex]::Matches($out, '(?m)^\[X\] Module .*$')
          if ($failed.Count -gt 0) {
            throw "Modules failed on a real Windows:`n$(($failed | ForEach-Object Value) -join "`n")"
          }
          if ($out -notmatch '(?m)^\[OK\] Module ') { throw 'No module reported finishing' }
          # Exit codes 1 and 2 are findings on the runner, not failures, but
          # Actions ends a pwsh step with the last native exit code.
          exit 0

      - name: Runner samples (temporary)
        if: always()
        shell: pwsh
        run: Get-Content (Join-Path $env:RUNNER_TEMP 'runner-samples.txt') -ErrorAction SilentlyContinue

  msrv:
    name: Minimum Supported Rust Version
    runs-on: windows-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'documentation') }}
    steps:
      - uses: actions/checkout@v7

      # Read the MSRV out of the manifest instead of hardcoding it here, so
      # bumping `rust-version` in Cargo.toml automatically moves this gate too.
      - name: Read MSRV from Cargo.toml
        id: msrv
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^rust-version\s*=\s*"([^"]+)"'
          if (-not $match) {
            Write-Error "No rust-version key found in Cargo.toml"
            exit 1
          }
          $version = $match.Matches[0].Groups[1].Value
          Write-Host "MSRV from manifest: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup pinned MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Runs on every change, not only when the manifest moves: the MSRV breaks
      # just as easily by using a newer language feature in ordinary source as
      # by bumping a dependency, and catching that is the entire point.
      - name: Check Against MSRV
        run: cargo check --locked --all-targets

  # Reads Cargo.lock rather than compiling, so it needs neither Windows nor a
  # build of the crate — which is why it can run on the cheaper Linux runner.
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'documentation') }}
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@cargo-audit

      # Plain `cargo audit` fails on a vulnerability and passes on an
      # informational warning, which is the policy we want: a gate that goes red
      # for reasons nobody can act on is a gate people learn to ignore, and the
      # warnings still show up in the job log either way.
      #
      # The three this comment used to enumerate (RUSTSEC-2024-0436 `paste`,
      # RUSTSEC-2026-0002 and RUSTSEC-2026-0253 `lru`) all arrived through
      # ratatui and left with it when the terminal front end was replaced by
      # egui. The tree audits clean as of that change.
      - name: Audit Dependencies
        run: cargo audit

  # `lto = true` plus `codegen-units = 1` makes this the most expensive job in
  # the workflow by a wide margin, and on a pull request it proves only that
  # the release profile still links. Run it once per merge instead of once per
  # push to every open branch; the release workflow builds the real artifact.
  build:
    name: Build Release Binary
    runs-on: windows-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --locked --release

      - name: Verify Binary
        shell: pwsh
        run: |
          if (-not (Test-Path .\target\release\winmedic.exe)) {
            Write-Error "Release binary was not generated!"
            exit 1
          }
          .\target\release\winmedic.exe --version
