name: CI

on:
  push:
    branches: [ "main" ]
  # Deliberately unfiltered: a `branches:` filter here matches the PR's *target*
  # branch, so restricting it to main means pull requests into any other branch
  # (long-lived feature branches, release branches) merge without ever being
  # linted, tested or built.
  pull_request:

# Force-pushing to a branch under review should not leave the superseded run
# burning a Windows runner to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Least privilege by default; the audit job widens this for itself.
permissions:
  contents: read

jobs:
  # rustfmt, clippy and the test suite share one runner. They do not share a
  # compile — clippy caches under its own driver — but they do share the
  # checkout, the toolchain install and the cache round trip, which is the
  # fixed cost that made a separate `check` job wasteful.
  test:
    name: Lints & Test Suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # Cheapest gate first: no build required, so a misformatted PR fails in
      # seconds instead of after a full compile.
      - name: Check Formatting (rustfmt)
        run: cargo fmt -- --check

      - name: Lint (clippy)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --locked --verbose

      # The tests feed the modules captured tool output. This feeds them the
      # runner's own Windows: a real scan, read-only — nothing is repaired —
      # that has to end with every module finished. Mocks answer whatever they
      # are asked; this is what notices when Windows would not have. It is the
      # check that would have caught wevtutil refusing every event log query
      # WinMedic sent, which no unit test could.
      - name: Smoke-test a real scan
        shell: pwsh
        run: |
          $out = cargo run --locked --quiet -- --scan 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -gt 2) { throw "winmedic --scan exited with $code" }
          $failed = [regex]::Matches($out, '(?m)^\[X\] Module .*$')
          if ($failed.Count -gt 0) {
            throw "Modules failed on a real Windows:`n$(($failed | ForEach-Object Value) -join "`n")"
          }
          if ($out -notmatch '(?m)^\[OK\] Module ') { throw 'No module reported finishing' }
          # Exit codes 1 and 2 are findings on the runner, not failures, but
          # Actions ends a pwsh step with the last native exit code.
          exit 0

  msrv:
    name: Minimum Supported Rust Version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Read the MSRV out of the manifest instead of hardcoding it here, so
      # bumping `rust-version` in Cargo.toml automatically moves this gate too.
      - name: Read MSRV from Cargo.toml
        id: msrv
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^rust-version\s*=\s*"([^"]+)"'
          if (-not $match) {
            Write-Error "No rust-version key found in Cargo.toml"
            exit 1
          }
          $version = $match.Matches[0].Groups[1].Value
          Write-Host "MSRV from manifest: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup pinned MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      # Runs on every change, not only when the manifest moves: the MSRV breaks
      # just as easily by using a newer language feature in ordinary source as
      # by bumping a dependency, and catching that is the entire point.
      - name: Check Against MSRV
        run: cargo check --locked --all-targets

  # Reads Cargo.lock rather than compiling, so it needs neither Windows nor a
  # build of the crate — which is why it can run on the cheaper Linux runner.
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@cargo-audit

      # Plain `cargo audit` fails on a vulnerability and passes on an
      # informational warning, which is the policy we want: a gate that goes red
      # for reasons nobody can act on is a gate people learn to ignore, and the
      # warnings still show up in the job log either way.
      #
      # The three this comment used to enumerate (RUSTSEC-2024-0436 `paste`,
      # RUSTSEC-2026-0002 and RUSTSEC-2026-0253 `lru`) all arrived through
      # ratatui and left with it when the terminal front end was replaced by
      # egui. The tree audits clean as of that change.
      - name: Audit Dependencies
        run: cargo audit

  # `lto = true` plus `codegen-units = 1` makes this the most expensive job in
  # the workflow by a wide margin, and on a pull request it proves only that
  # the release profile still links. Run it once per merge instead of once per
  # push to every open branch; the release workflow builds the real artifact.
  build:
    name: Build Release Binary
    runs-on: windows-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --locked --release

      - name: Verify Binary
        shell: pwsh
        run: |
          if (-not (Test-Path .\target\release\winmedic.exe)) {
            Write-Error "Release binary was not generated!"
            exit 1
          }
          .\target\release\winmedic.exe --version
