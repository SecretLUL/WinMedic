name: CI

on:
  push:
    branches: [ "main" ]
  # Deliberately unfiltered: a `branches:` filter here matches the PR's *target*
  # branch, so restricting it to main means pull requests into any other branch
  # (long-lived feature branches, release branches) merge without ever being
  # linted, tested or built.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Code Formatting & Clippy Lints
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting (rustfmt)
        run: cargo fmt -- --check

      - name: Lint (clippy)
        run: cargo clippy --locked --all-targets -- -D warnings

  msrv:
    name: Minimum Supported Rust Version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Read the MSRV out of the manifest instead of hardcoding it here, so
      # bumping `rust-version` in Cargo.toml automatically moves this gate too.
      - name: Read MSRV from Cargo.toml
        id: msrv
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^rust-version\s*=\s*"([^"]+)"'
          if (-not $match) {
            Write-Error "No rust-version key found in Cargo.toml"
            exit 1
          }
          $version = $match.Matches[0].Groups[1].Value
          Write-Host "MSRV from manifest: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup pinned MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Check Against MSRV
        run: cargo check --locked --all-targets

  test:
    name: Test Suite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --locked --verbose

  build:
    name: Build Release Binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --locked --release

      - name: Verify Binary
        shell: pwsh
        run: |
          if (-not (Test-Path .\target\release\winmedic.exe)) {
            Write-Error "Release binary was not generated!"
            exit 1
          }
          .\target\release\winmedic.exe --version
