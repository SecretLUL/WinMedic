<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">WinMedic</title>
  <desc id="desc">Healing Windows at 1 HP. Fast. Reliable. Easy.</desc>
  <style>
    .panel { fill: #F8F8F8; stroke: #BEBEBE; }
    .name { fill: #191919; }
    .tagline { fill: #5F5F5F; }
    .mark { stroke: #0F7B0F; }
    .cross { fill: #0F7B0F; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #1B1B1B; stroke: #3C3C3C; }
      .name { fill: #D7D7D7; }
      .tagline { fill: #919191; }
      .mark { stroke: #64C378; }
      .cross { fill: #64C378; }
    }
    text { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="1199" height="299" rx="8" stroke-width="1"/>

  <!-- The mark: a shield and a cross, one line, one colour. -->
  <g transform="translate(118 78)">
    <path class="mark" d="M60 4 L112 22 V66 C112 100 90 124 60 138 C30 124 8 100 8 66 V22 Z"
          fill="none" stroke-width="7" stroke-linejoin="round"/>
    <rect class="cross" x="51" y="38" width="18" height="64" rx="2"/>
    <rect class="cross" x="28" y="61" width="64" height="18" rx="2"/>
  </g>

  <text class="name" x="296" y="152" font-size="76" font-weight="600" letter-spacing="-1">WinMedic</text>
  <text class="tagline" x="298" y="200" font-size="27">Healing Windows at 1 HP. Fast. Reliable. Easy.</text>
</svg>
