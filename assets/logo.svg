<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">WinMedic</title>
  <!-- A shield and a cross, one colour. The white inside keeps it readable
       on a dark taskbar. The shield's side walls and the cross's arms line up
       with whole pixels at 16, 32 and 48 px, so the small icons stay sharp.
       Change it, then run scripts/render-icon.ps1. -->
  <path d="M128 16 L216 44 V120 C216 178 178 218 128 240 C78 218 40 178 40 120 V44 Z"
        fill="#FFFFFF" stroke="#0F7B0F" stroke-width="16" stroke-linejoin="round"/>
  <rect x="112" y="72" width="32" height="112" rx="3" fill="#0F7B0F"/>
  <rect x="72" y="112" width="112" height="32" rx="3" fill="#0F7B0F"/>
</svg>
